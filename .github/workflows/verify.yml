name: Verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.12'
            extra: '.[windows]'
          - os: macos-15
            python: '3.12'
            extra: '.[macos]'
          - os: ubuntu-24.04
            python: '3.9'
            extra: '.'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "${{ matrix.extra }}"
      - run: python -m unittest discover -s tests -v
