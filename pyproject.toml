[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "any2cli"
dynamic = ["version"]
description = "Discover desktop operations and compile reusable app-specific CLI commands"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
macos = ["openadapt-flow[macos]==3.4.0; sys_platform == 'darwin'"]
windows = ["uiautomation==2.0.29; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/lvzht5/Any2CLI"

[project.scripts]
any2cli = "any2cli:main"

[tool.setuptools]
py-modules = ["any2cli", "macos_openadapt"]
packages = ["any2cli_core"]

[tool.setuptools.dynamic]
version = {attr = "any2cli.__version__"}
